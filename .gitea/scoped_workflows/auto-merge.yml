# SPDX-License-Identifier: MIT
name: auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: (github.repository == 'admin/libreharness' || github.repository == 'admin/credarr') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out the trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0

      - name: Check out the PR tree without executing it
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Reject symlinks and submodules
        run: |
          set -euo pipefail
          if git -C pr diff --summary "$BASE_SHA...$HEAD" | grep -Eq '120000|160000'; then
            echo "symlinks and submodules are not allowed in auto-merged PRs"
            exit 1
          fi

      - name: Verify consumer gate scripts
        run: |
          set -euo pipefail
          cat > /tmp/gate-scripts.sha256 <<'EOF'
          b7a37b25cb55dbf49c66d4925b2d695681c3f2094dca110708e70c6af2cc89ab  base/bin/pr_policy.py
          b5b80c08a83902471dc619f32f88769484fb16f4f14842948b8ab06492fae5a5  base/bin/pr_status.py
          20c145608484f203632859339a80a69fbef425fc08008e170333760cab692d2e  base/bin/pr_merge.py
          77ea3f2b3294647ebbb696d129d59fabd8b1fbd314a2001e39e760e75ce51fec  base/bin/scan_private.py
          EOF
          sha256sum -c /tmp/gate-scripts.sha256
      - name: Policy and repository checks
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ github.api_url }}
          BASE_ROOT: base
          PR_ROOT: pr
        run: |
          set -euo pipefail
          python3 base/bin/pr_policy.py --repo "$REPO" --pr "$PR" --head "$HEAD" --base main
          if [ -x base/bin/verify_pr.sh ]; then
            base/bin/verify_pr.sh
          else
            echo "no repo-specific verifier; generic checks only"
          fi
          /tmp/gitleaks detect --source pr --config base/.gitleaks.toml --redact --verbose
          git -C pr diff --check "$BASE_SHA...$HEAD"

  publish:
    needs: verify
    if: always() && (github.repository == 'admin/libreharness' || github.repository == 'admin/credarr') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      REPO: ${{ github.repository }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      RESULT: ${{ needs.verify.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1

      - name: Publish verifier status
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            state=success
            description="policy and repository checks passed"
          else
            state=failure
            description="policy or repository checks failed ($RESULT)"
          fi
          python3 base/bin/pr_status.py \
            --repo "$REPO" --head "$HEAD" --state "$state" \
            --context "verifier / policy" --description "$description" \
            --target-url "$RUN_URL" --api "$API_URL"

  merge:
    needs: [verify, publish]
    if: needs.verify.result == 'success' && (github.repository == 'admin/libreharness' || github.repository == 'admin/credarr') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      API_URL: ${{ github.api_url }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1

      - name: Schedule auto-merge
        run: |
          set -euo pipefail
          python3 base/bin/pr_merge.py \
            --repo "$REPO" --pr "$PR" --head "$HEAD" --base main \
            --api "$API_URL"
