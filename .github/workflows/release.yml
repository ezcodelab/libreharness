# SPDX-License-Identifier: MIT
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify package version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Package dry run
        run: npm pack --dry-run
      - name: Full checks
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 bin/docs_lint.py . --skills-dir skills
          python3 bin/check_spdx.py --root .
          python3 bin/scan_private.py --root .
      - name: Archive
        run: |
          git archive --format=tar.gz --prefix="libreharness-${GITHUB_REF_NAME}/" -o "libreharness-${GITHUB_REF_NAME}.tar.gz" HEAD
          sha256sum "libreharness-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "libreharness-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS --verify-tag --notes-file CHANGELOG.md
