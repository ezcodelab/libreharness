# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Node tests
        run: |
          node tests/auto-intake.test.mjs
          node tests/goal-watch.test.mjs
          node tests/review-protocol.test.mjs
          node tests/security-guard.test.mjs
          node tests/installer.test.mjs
      - name: Package dry run
        run: npm pack --dry-run
      - name: Docs lint
        run: python3 bin/docs_lint.py . --skills-dir skills
      - name: SPDX
        run: python3 bin/check_spdx.py --root .
      - name: Private-path scan
        run: python3 bin/scan_private.py --root .
      - name: Shellcheck
        run: |
          if ls bin/*.sh >/dev/null 2>&1; then shellcheck -x bin/*.sh; else echo "no shell scripts"; fi
      - name: Secret scan
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress "**/*.md"
          fail: true
