# SPDX-License-Identifier: MIT
name: auto-merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: auto-merge / verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out the trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0

      # actions/checkout is pinned to v4.4.0. Fork merge refs require
      # allow-unsafe-pr-checkout: true in a later major; this tree is scanned as
      # data, never executed.
      - name: Check out the PR merge ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Reject symlinks and submodules
        run: |
          set -euo pipefail
          if git -C pr diff --summary "$BASE_SHA...$HEAD" | grep -Eq '120000|160000'; then
            echo "symlinks and submodules are not allowed in auto-merged PRs"
            exit 1
          fi

      - name: Policy checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          meta=$(gh pr view "$PR" --json state,isDraft,baseRefName,headRefOid,labels,additions,deletions,files)
          test "$(jq -r .state <<<"$meta")" = "OPEN"
          test "$(jq -r .isDraft <<<"$meta")" = "false"
          test "$(jq -r .baseRefName <<<"$meta")" = "main"
          test "$(jq -r .headRefOid <<<"$meta")" = "$HEAD"
          test "$(jq -r '.additions + .deletions' <<<"$meta")" -le 2000
          test "$(jq -r '.files | length' <<<"$meta")" -le 50
          if jq -r '.labels[].name' <<<"$meta" | grep -Eq '^(do-not-merge|no-auto-merge|wip)$'; then
            echo "blocked label present"
            exit 1
          fi

          gh pr diff "$PR" --name-only > /tmp/pr-files.txt
          fail=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.gitleaks.toml|AGENTS.md|SECURITY.md|package.json|package-lock.json|bin/tasks.py|bin/jev_*.py|opencode.example.json)
                echo "protected path: $path"
                fail=1
                ;;
            esac
            case "$(basename "$path")" in
              .env|.npmrc|.pypirc|*.key|*.p12|*.pem|*.pfx|credentials|id_ed25519|id_rsa|secrets.json|secrets.yaml|secrets.yml)
                echo "forbidden file: $path"
                fail=1
                ;;
            esac
          done < /tmp/pr-files.txt

          gh pr diff "$PR" > /tmp/pr.diff
          for marker in "/home/cachyos" "Documents/homelab" ".vault_pass" "GITEA_API_TOKEN"; do
            if grep -E '^\+' /tmp/pr.diff | grep -Fq -- "$marker"; then
              echo "private marker in added line: $marker"
              fail=1
            fi
          done
          test "$fail" -eq 0

          /tmp/gitleaks detect --source pr --config base/.gitleaks.toml --redact --verbose
          git -C pr diff --check "$BASE_SHA...$HEAD"

  merge:
    name: auto-merge / merge
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for required checks
        run: gh pr checks "$PR" --watch --required --interval 20

      - name: Merge the exact verified head
        run: gh pr merge "$PR" --merge --match-head-commit "$HEAD"
