# SPDX-License-Identifier: MIT
name: auto-merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Schedule the merge
        env:
          MERGE_TOKEN: ${{ secrets.MERGE_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api = os.environ["API_URL"].rstrip("/")
          repo = os.environ["REPO"]
          pr = os.environ["PR"]
          head = os.environ["HEAD"]
          token = os.environ["MERGE_TOKEN"]

          def call(method, path, payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(
                  f"{api}/repos/{repo}{path}",
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"token {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read().decode()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode()[:500]

          def refuse(message):
              raise SystemExit(f"auto-merge refused: {message}")

          status, prdata = call("GET", f"/pulls/{pr}")
          if status != 200:
              refuse(f"cannot read PR ({status}): {prdata}")
          if prdata.get("merged"):
              print("already merged")
              raise SystemExit(0)
          if prdata.get("state") != "open" or prdata.get("draft"):
              refuse("not an open ready PR")

          head_repo = ((prdata.get("head") or {}).get("repo") or {}).get(
              "full_name"
          )
          if head_repo != repo:
              refuse("fork PR requires manual review and merge")

          base = (prdata.get("base") or {}).get("ref") or ""
          if base != "main":
              refuse(f"base is {base!r}, not main")
          if ((prdata.get("head") or {}).get("sha") or "").lower() != head.lower():
              refuse("head moved")

          for _ in range(6):
              if prdata.get("mergeable") is not None:
                  break
              time.sleep(5)
              status, prdata = call("GET", f"/pulls/{pr}")
              if status != 200:
                  refuse(f"cannot read PR ({status}): {prdata}")
          if not prdata.get("mergeable"):
              refuse("PR is not mergeable")

          status, policy_data = call(
              "GET", f"/contents/.github/merge-policy.json?ref={base}"
          )
          if status != 200:
              refuse(
                  "merge policy is missing at "
                  f".github/merge-policy.json on {base} ({status})"
              )
          try:
              policy_raw = base64.b64decode(
                  policy_data.get("content", "")
              ).decode()
              policy = json.loads(policy_raw)
          except (ValueError, TypeError, json.JSONDecodeError):
              refuse("merge policy is not valid base64 JSON")
          if not isinstance(policy, dict):
              refuse("merge policy is not a JSON object")

          def string_list(name):
              value = policy.get(name, [])
              if not isinstance(value, list) or not all(
                  isinstance(item, str) and item for item in value
              ):
                  refuse(f"merge policy {name} must be a list of strings")
              return value

          protected = [
              ".github/merge-policy.json",
              ".github/workflows/",
              ".gitea/workflows/",
          ] + string_list("protected_paths")
          forbidden = [
              ".env",
              ".netrc",
              ".npmrc",
              ".pypirc",
              "id_rsa",
              "id_ed25519",
          ] + string_list("forbidden_files")
          blocking = {
              "do-not-merge",
              "wip",
              "hold",
          } | set(string_list("blocking_labels"))
          merge_method = str(policy.get("merge_method", "merge"))
          if merge_method not in {
              "merge",
              "rebase",
              "rebase-merge",
              "squash",
              "fast-forward-only",
          }:
              refuse(f"unsupported merge_method {merge_method!r}")
          delete_branch = bool(policy.get("delete_branch_after_merge", True))
          labels = {
              item.get("name")
              for item in (prdata.get("labels") or [])
              if isinstance(item, dict)
          }
          if labels & blocking:
              refuse(f"blocking label: {sorted(labels & blocking)}")

          def check_name(name):
              normalized = str(name or "").replace("\\", "/").strip()
              if not normalized:
                  refuse("empty path in the PR file list")
              if normalized.startswith("/") or ".." in normalized.split("/"):
                  refuse(f"invalid path: {name}")
              if any(
                  normalized == prefix.rstrip("/")
                  or normalized.startswith(prefix)
                  for prefix in protected
              ):
                  refuse(f"protected path requires manual merge: {name}")
              basename = normalized.rsplit("/", 1)[-1]
              if basename in forbidden:
                  refuse(f"forbidden file: {name}")
              if basename.startswith(".env.") and not basename.endswith(".example"):
                  refuse(f"forbidden file: {name}")
              if basename.endswith((".pem", ".key", ".p12", ".pfx", ".jks", ".keystore")):
                  refuse(f"forbidden file: {name}")

          page = 1
          while True:
              status, files = call(
                  "GET", f"/pulls/{pr}/files?limit=50&page={page}"
              )
              if status != 200 or not isinstance(files, list):
                  refuse(f"cannot read PR files ({status})")
              for item in files:
                  check_name(item.get("filename"))
                  if item.get("previous_filename"):
                      check_name(item.get("previous_filename"))
              if len(files) < 50:
                  break
              page += 1

          status, latest = call("GET", f"/pulls/{pr}")
          if status != 200:
              refuse(f"cannot re-read PR ({status}): {latest}")
          if latest.get("state") != "open" or latest.get("draft"):
              refuse("PR is no longer open and ready")
          if ((latest.get("head") or {}).get("sha") or "").lower() != head.lower():
              refuse("head moved during verification")
          if not latest.get("mergeable"):
              refuse("PR became unmergeable during verification")
          latest_labels = {
              item.get("name")
              for item in (latest.get("labels") or [])
              if isinstance(item, dict)
          }
          if latest_labels & blocking:
              refuse(f"blocking label added: {sorted(latest_labels & blocking)}")

          status, result = call(
              "POST",
              f"/pulls/{pr}/merge",
              {
                  "do": merge_method,
                  "merge_when_checks_succeed": True,
                  "head_commit_id": head,
                  "delete_branch_after_merge": delete_branch,
              },
          )
          if status not in (200, 201):
              refuse(f"merge request failed ({status}): {result}")
          print("auto-merge scheduled")
          PY
